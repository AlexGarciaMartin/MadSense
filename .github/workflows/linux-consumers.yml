name: Linux consumer compilation and owned runtime
on:
  workflow_dispatch:
  push:
    branches: [feature/linux]
    paths:
      - '.github/workflows/linux-consumers.yml'
      - 'linux/platform/**'
      - 'vendor/DualSenseClient/**'
      - 'linux/research/consumer-build/**'
      - 'linux/research/build_consumers.sh'
      - 'linux/research/consumer_*'
      - 'linux/research/consumer-NOTICES.txt'
      - 'linux/research/CONSUMERS.md'
      - 'linux/research/ff_probe.c'
      - 'linux/research/run_consumers.py'
      - 'linux/research/run_wine_consumer.py'
      - 'linux/research/test_consumer_session.py'
      - 'linux/research/qemu_consumers.py'
      - 'linux/research/run_consumer_guest.sh'
      - 'linux/research/CONSUMER-SESSION.md'
      - 'linux/research/audio_defaults.py'
      - 'linux/research/test_audio_defaults.py'
      - 'linux/research/AUDIO-DEFAULTS-OBSERVER.md'
      - 'linux/research/pipewire_defaults.py'
      - 'linux/research/test_pipewire_defaults.py'
      - 'linux/research/PIPEWIRE-DEFAULTS-OBSERVER.md'
      - 'linux/research/ge_umu_*'
      - 'linux/research/ge-umu-lock.json'
      - 'linux/research/test_ge_umu.py'
      - 'linux/research/GE-UMU.md'
      - 'linux/research/ci_environment.py'
      - 'linux/research/wine_consumer.cpp'
      - 'linux/research/build_wine_consumer.sh'
      - 'linux/research/WINE-CONSUMER.md'
      - 'LICENSE'
permissions:
  contents: read
jobs:
  evidence-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Consumer scope and capture regressions
        run: |
          python3 -m unittest discover -s linux/research -p test_consumer_session.py -v
          python3 -m unittest discover -s linux/research -p test_audio_defaults.py -v
          python3 -m unittest discover -s linux/research -p test_pipewire_defaults.py -v
          python3 -m unittest discover -s linux/research -p test_ge_umu.py -v
          python3 -m py_compile linux/research/consumer_session.py linux/research/run_wine_consumer.py linux/research/qemu_consumers.py
          bash -n linux/research/run_consumer_guest.sh
  windows-api-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare MinGW Windows compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y g++-mingw-w64-x86-64
      - name: Compile Windows API observer without executing it
        shell: bash
        run: |
          set -o pipefail
          mkdir -p dist
          bash linux/research/build_wine_consumer.sh dist/wine-consumer 2>&1 | tee dist/wine-consumer-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-api-consumer-build
          path: |
            dist/wine-consumer/**
            dist/wine-consumer-build.log
          retention-days: 14
          if-no-files-found: warn
  consumers-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare consumer compiler and distribution SDL2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential cmake pkg-config libsdl2-dev libudev-dev curl ca-certificates
      - name: Compile independent SDL2 SDL3 and Xbox force-feedback observers
        shell: bash
        run: |
          set -o pipefail
          mkdir -p dist
          bash linux/research/build_consumers.sh dist/linux-consumers 2>&1 | tee dist/linux-consumers-build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-consumers-build
          path: |
            dist/linux-consumers/bin/**
            dist/linux-consumers/notices/**
            dist/linux-consumers/source/**
            dist/linux-consumers/SDL3.tar.gz
            dist/linux-consumers/provenance.txt
            dist/linux-consumers/binary-sha256.txt
            dist/linux-consumers/build/CMakeCache.txt
            dist/linux-consumers/build/CMakeFiles/CMakeConfigureLog.yaml
            dist/linux-consumers-build.log
          retention-days: 14
          if-no-files-found: warn
  runtime:
    needs: [evidence-tests, consumers-build, windows-api-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/download-artifact@v4
        with:
          name: linux-consumers-build
          path: dist/consumer-build
      - uses: actions/download-artifact@v4
        with:
          name: windows-api-consumer-build
          path: dist/windows-build
      - name: Publish neutral exporter and production core actor
        run: |
          dotnet publish linux/probe/MadSense.Linux.Probe.csproj -c Release -r linux-x64 --self-contained true -o dist/neutral-probe
          dotnet publish linux/platform/integration/MadSense.Linux.CoreProbe.csproj -c Release -r linux-x64 --self-contained true -p:RestoreLockedMode=true -o dist/core-probe
      - name: Install official-image guest tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils ubuntu-keyring ubuntu-cloudimage-keyring openssh-client acl
          test -r /usr/share/keyrings/ubuntu-cloudimage-keyring.gpg
      - name: Record existing KVM capabilities
        run: |
          python3 linux/research/kvm_inventory.py --probe-api > dist/kvm-runner.json
          sudo -n python3 linux/research/kvm_inventory.py --probe-api > dist/kvm-root.json
      - name: Ordinary SDL and Wine consumers of the production core in owned QEMU
        run: >-
          python3 linux/research/qemu_consumers.py
          --neutral-probe-directory dist/neutral-probe --core-probe-directory dist/core-probe
          --native-artifact dist/consumer-build/linux-consumers
          --windows-artifact dist/windows-build/wine-consumer
          --observe-audio-defaults
          --output dist/consumer-runtime --work dist/consumer-qemu-private
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-consumer-runtime-dualsense
          path: |
            dist/consumer-runtime/**
            dist/kvm-*.json
          retention-days: 14
          if-no-files-found: warn
