name: Linux kernel USB-IP neutral integration
on:
  workflow_dispatch:
  push:
    branches: [feature/linux]
    paths:
      - '.github/workflows/linux-kernel.yml'
      - 'linux/probe/**'
      - 'linux/research/host_probe.c'
      - 'linux/research/kernel_probe.py'
      - 'linux/research/test_kernel_probe.py'
      - 'linux/research/ci_environment.py'
      - 'linux/research/test_ci_environment.py'
      - 'linux/research/prepare_kernel.sh'
      - 'linux/research/qemu_kernel.py'
      - 'linux/research/run_guest.sh'
      - 'linux/research/kvm_inventory.py'
      - 'linux/research/kvm_acceleration.py'
      - 'linux/research/test_kvm_acceleration.py'
      - 'vendor/DualSenseClient/DualSenseClient.Emulation/**'
      - 'tests/DualSenseClient.Tests/Emulation/**'
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        persona: [dualsense, edge, xbox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Protocol regressions
        run: |
          dotnet test linux/probe/tests/MadSense.Linux.Protocol.Tests.csproj -c Release --logger 'trx;LogFileName=protocol.trx' --results-directory dist/linux-protocol
          python3 -m unittest discover -s linux/research -p 'test_*.py'
      - name: Build neutral exporter and independent host observer
        run: |
          dotnet publish linux/probe/MadSense.Linux.Probe.csproj -c Release -r linux-x64 --self-contained true -o dist/linux-probe
          gcc -std=c11 -D_POSIX_C_SOURCE=200809L -O2 -Wall -Wextra -Werror linux/research/host_probe.c -o dist/linux-host-probe
      - name: Prepare official-image guest tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils ubuntu-keyring ubuntu-cloudimage-keyring openssh-client acl
          test -r /usr/share/keyrings/ubuntu-cloudimage-keyring.gpg
      - name: Record existing KVM capability without changing host permissions
        run: |
          python3 linux/research/kvm_inventory.py --probe-api > dist/kvm-runner.json
          sudo -n python3 linux/research/kvm_inventory.py --probe-api > dist/kvm-root.json
      - name: Verify owned virtual device in a signed Ubuntu kernel guest
        run: >-
          python3 linux/research/qemu_kernel.py --persona '${{ matrix.persona }}'
          --probe-directory dist/linux-probe --host-probe dist/linux-host-probe
          --output dist/linux-guest --work dist/qemu-private
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-kernel-${{ matrix.persona }}
          path: |
            dist/linux-guest/**
            dist/linux-protocol/**
            dist/kvm-*.json
          retention-days: 14
          if-no-files-found: warn
