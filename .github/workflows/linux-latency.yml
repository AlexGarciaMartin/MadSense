name: Linux input timing observer validation
on:
  workflow_dispatch:
    inputs:
      run_native:
        description: 'Run all functional gates then optional timing in one owned x64 VM'
        type: boolean
        required: false
        default: false
      trace_stages:
        description: 'Compare untouched actors with a separate instrumented source copy (requires run_native)'
        type: boolean
        required: false
        default: false
      trace_input:
        description: '1000 Hz control/client-input-tail/client-input-tail/control (exclusive with trace_stages)'
        type: boolean
        required: false
        default: false
  push:
    branches: [feature/linux]
    paths:
      - '.github/workflows/linux-latency.yml'
      - 'linux/tests/latency/**'
      - 'linux/tests/audio-hotplug/actor_files.py'
      - 'linux/app/LinuxBridgeController.cs'
permissions:
  contents: read
jobs:
  observer:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Record source and native compiler
        run: |
          mkdir -p dist/latency-observer
          git rev-parse HEAD > dist/latency-observer/source.txt
          uname -a > dist/latency-observer/kernel.txt
          cc --version > dist/latency-observer/compiler.txt
          python3 -c 'import sys,shutil; assert sys.platform == "linux" and shutil.which("cc"), "Native compilation cannot be skipped"'
      - name: Compile observer and reject invalid timing evidence
        run: |
          set -o pipefail
          python3 -m unittest discover -s linux/tests/latency -p 'test_*.py' -v 2>&1 | tee dist/latency-observer/tests.txt
          python3 -m py_compile linux/tests/latency/*.py
          bash -n linux/tests/latency/run_latency_experiment.sh
      - name: Exercise bounded recording and concurrent publication on native Linux
        run: |
          set -o pipefail
          dotnet run --project linux/tests/latency/trace-tests/Trace.Tests.csproj -c Release -- concurrent | tee dist/latency-observer/trace-concurrent.txt
          dotnet run --project linux/tests/latency/trace-tests/Trace.Tests.csproj -c Release --no-build -- overflow | tee dist/latency-observer/trace-overflow.txt
          dotnet run --project linux/tests/latency/input-trace-tests/InputTrace.Tests.csproj -c Release -- concurrent | tee dist/latency-observer/input-concurrent.txt
          dotnet run --project linux/tests/latency/input-trace-tests/InputTrace.Tests.csproj -c Release --no-build -- tail | tee dist/latency-observer/input-tail.txt
          dotnet run --project linux/tests/latency/input-trace-tests/InputTrace.Tests.csproj -c Release --no-build -- collision | tee dist/latency-observer/input-collision.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-latency-observer-${{ matrix.runner }}
          path: dist/latency-observer/**
          retention-days: 14
          if-no-files-found: warn
  native:
    if: github.event_name == 'workflow_dispatch' && inputs.run_native
    needs: observer
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Require one explicit instrumentation variant
        if: inputs.trace_stages && inputs.trace_input
        run: |
          echo 'trace_stages and trace_input are mutually exclusive' >&2
          exit 2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish the actual functional actors
        run: |
          dotnet publish linux/probe/MadSense.Linux.Probe.csproj -c Release -r linux-x64 --self-contained true -o dist/neutral-probe
          dotnet publish linux/platform/integration/MadSense.Linux.CoreProbe.csproj -c Release -r linux-x64 --self-contained true -p:RestoreLockedMode=true -o dist/core-probe
          dotnet publish linux/tests/app-integration/MadSense.Linux.AppProbe.csproj -c Release -r linux-x64 --self-contained true -p:RestoreLockedMode=true -o dist/app-probe
      - name: Publish a separate source overlay for internal attribution
        if: inputs.trace_stages || inputs.trace_input
        env:
          TRACE_SOURCE: ${{ runner.temp }}/madsense-trace-source-${{ github.run_id }}-${{ github.run_attempt }}
          TRACE_KIND: ${{ inputs.trace_input && 'input' || 'stages' }}
        run: |
          python3 linux/tests/latency/stage_trace.py --output "$TRACE_SOURCE" --kind "$TRACE_KIND"
          dotnet publish "$TRACE_SOURCE/linux/tests/app-integration/MadSense.Linux.AppProbe.csproj" -c Release -r linux-x64 --self-contained true -p:RestoreLockedMode=true -p:SourceRevisionId="$GITHUB_SHA" -o dist/app-probe-trace
          cp "$TRACE_SOURCE/research-trace-overlay.json" dist/app-probe-trace/
      - name: Install tools for the pinned signed guest
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils ubuntu-keyring ubuntu-cloudimage-keyring openssh-client acl
          test -r /usr/share/keyrings/ubuntu-cloudimage-keyring.gpg
      - name: Inventory existing KVM capability
        run: |
          python3 linux/research/kvm_inventory.py --probe-api > dist/kvm-runner.json
          sudo -n python3 linux/research/kvm_inventory.py --probe-api > dist/kvm-root.json
      - name: Functional gates and independent timing in the same owned VM
        env:
          TRACE_STAGES: ${{ (inputs.trace_stages || inputs.trace_input) && 'true' || 'false' }}
        run: |
          trace_arguments=()
          if [[ "$TRACE_STAGES" == true ]]; then
            trace_arguments=(--trace-probe-directory dist/app-probe-trace)
          fi
          python3 linux/tests/latency/qemu_latency.py \
            --neutral-probe-directory dist/neutral-probe --core-probe-directory dist/core-probe \
            --app-probe-directory dist/app-probe \
            --output dist/latency-guest --work dist/latency-qemu-private "${trace_arguments[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-latency-runtime-x64
          path: |
            dist/latency-guest/**
            dist/kvm-*.json
          retention-days: 14
          if-no-files-found: warn
