name: macOS HID access research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        # Official standard labels, verified against actions/runner-images.
        runner: [macos-15, macos-15-intel, macos-26, macos-26-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compare kernel, IOHID and CoreHID access without changing security
        run: python3 macos/research/run_hid_access_probe.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hid-access-${{ matrix.runner }}
          path: dist/hid-access/*
          retention-days: 14
          if-no-files-found: error
