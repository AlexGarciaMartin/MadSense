name: macOS audio path research
on:
  workflow_dispatch:
  push:
    branches: [feature/macos]
    paths:
      - '.github/workflows/macos-audio-research.yml'
      - 'macos/research/*audio*'
      - 'macos/research/AudioProbeSignal.hpp'
      - 'macos/research/AudioIngressTrace.hpp'
permissions:
  contents: read
concurrency:
  group: macos-audio-research-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audio-research:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
        timestamp_period: [256, 16384]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compile HAL tests and isolated ingress research build
        run: |
          cmake -S macos/audio -B .build/audio -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0
          cmake --build .build/audio --parallel
          ctest --test-dir .build/audio --output-on-failure
          bash macos/research/build_audio_probe.sh .build/audio-research
          bash macos/research/build_audio_ingress.sh .build/audio-research .build/audio/MadSenseAudio.driver ${{ matrix.timestamp_period }}
          mkdir -p dist/audio-research
          cp .build/audio-research/ingress-source.json dist/audio-research/
      - name: Install and validate endpoint only on disposable runner
        timeout-minutes: 3
        run: bash macos/tests/install_audio_ci.sh .build/audio dist/audio-research
      - name: Measure callback to reader path and authenticated control calls
        timeout-minutes: 6
        run: |
          sw_vers > dist/audio-research/environment.txt
          uname -a >> dist/audio-research/environment.txt
          git rev-parse HEAD >> dist/audio-research/environment.txt
          python3 - <<'PY'
          import hashlib, json, pathlib, re, subprocess, sys
          output = pathlib.Path('dist/audio-research')
          sdk = pathlib.Path(subprocess.check_output(['xcrun', '--show-sdk-path'], text=True).strip())
          header = sdk / 'System/Library/Frameworks/CoreAudio.framework/Headers/AudioServerPlugIn.h'
          raw = header.read_bytes()
          text = raw.decode('utf-8')
          start = text.index('@constant       kAudioDevicePropertyZeroTimeStampPeriod')
          minimum = re.search(r'minimum allowed value for this is (\d+) sample frames', text[start:start + 1000])
          if minimum is None:
              raise RuntimeError('SDK timestamp minimum contract missing; re-review required')
          metadata = {
              'sdk_version': subprocess.check_output(['xcrun', '--show-sdk-version'], text=True).strip(),
              'header_path': str(header), 'header_sha256': hashlib.sha256(raw).hexdigest(),
              'documented_minimum_timestamp_period_frames': int(minimum[1]),
              'selected_timestamp_period_frames': ${{ matrix.timestamp_period }},
              'counter_contract_summary': 'The cycle ordinal begins at one, advances each cycle, and returns to one when the IO thread resynchronizes.'}
          (output / 'sdk-contract.json').write_text(json.dumps(metadata, indent=2) + '\n')
          with (output / 'audio-path.jsonl').open('w') as stdout, (output / 'audio-path.stderr').open('w') as stderr:
              try:
                  result = subprocess.run(
                      ['.build/audio-research/audio-path-probe', '--seconds', '30', '--trials', '3',
                       '--warmup', '2', '--control-iterations', '5000', '--require-ingress', '1'],
                      stdout=stdout, stderr=stderr, timeout=330)
              except subprocess.TimeoutExpired:
                  print('Audio research timed out; no latency conclusion is valid.', file=stderr)
                  sys.exit(1)
          print((output / 'audio-path.jsonl').read_text())
          print((output / 'audio-path.stderr').read_text(), file=sys.stderr)
          sys.exit(result.returncode)
          PY
      - name: Collect CoreAudio diagnostics
        if: always()
        run: |
          mkdir -p dist/audio-research
          log show --last 8m --style compact --info --debug \
            --predicate 'process == "coreaudiod" OR subsystem == "org.madsense.audio"' \
            > dist/audio-research/coreaudio-research.stdout 2> dist/audio-research/coreaudio-research.stderr
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audio-research-${{ matrix.runner }}-period${{ matrix.timestamp_period }}
          path: dist/audio-research/*
          retention-days: 14
